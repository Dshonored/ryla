name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The generated project has to build and run on every platform someone
        # might develop on. Each earns its place: Windows for the dev watcher's
        # process handling and the CRLF trap in the templates, macOS because
        # fsnotify uses a different backend there and the process-group kill on
        # Darwin is not the same code path as Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # This is the important one: it scaffolds every (database x web mode)
      # combination into a temp directory and checks the result builds, vets
      # and is gofmt-clean. Templates are text, so nothing else catches a
      # broken one.
      - name: Test
        run: go test ./...

  # MongoDB integration tests, on their own job because service containers only
  # exist on the Linux runners. Without this the live tests would skip
  # everywhere and quietly test nothing.
  mongo:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Test against MongoDB
        env:
          MONGO_TEST_URI: mongodb://localhost:27017
        # -run Live so a skip caused by a missing URI cannot hide here: these
        # are the tests this job exists for, and -v shows whether they ran.
        run: go test ./mongo/ -run Live -v
