name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The generated project has to build and run on every platform someone
        # might develop on. Each earns its place: Windows for the dev watcher's
        # process handling and the CRLF trap in the templates, macOS because
        # fsnotify uses a different backend there and the process-group kill on
        # Darwin is not the same code path as Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          # gofmt walks the filesystem and knows nothing about modules, so a
          # bare `gofmt -l .` also lints every nested module — which is how a
          # formatting slip on the website came to fail the framework's build.
          # `go vet` and `go test` are unaffected: ./... already stops at a
          # module boundary. Only this step had to be taught where the edges
          # are, and it is done by path so a second nested module needs no
          # change here.
          files=$(git ls-files '*.go')
          for m in $(git ls-files '*/go.mod' | sed 's#/go.mod$##'); do
            files=$(echo "$files" | grep -v "^$m/" || true)
          done

          unformatted=$(echo "$files" | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # This is the important one: it scaffolds every (database x web mode)
      # combination into a temp directory and checks the result builds, vets
      # and is gofmt-clean. Templates are text, so nothing else catches a
      # broken one.
      - name: Test
        run: go test ./...

  # The install script is the documented way onto a machine that has no Go, so
  # it cannot be checked by anything that assumes a Go toolchain. `go test`
  # covers its version drift; this covers the shell itself.
  install-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck the installer
        run: shellcheck --shell=sh install.sh

  # MongoDB integration tests, on their own job because service containers only
  # exist on the Linux runners. Without this the live tests would skip
  # everywhere and quietly test nothing.
  mongo:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Test against MongoDB
        env:
          MONGO_TEST_URI: mongodb://localhost:27017
        # Every package with a MongoDB driver, not just mongo/ — the stores hold
        # most of the live tests, and running only mongo/ would leave them
        # skipping everywhere and testing nothing.
        #
        # -run Live so a skip caused by a missing URI cannot hide here, and -v
        # so the log shows they genuinely ran.
        run: go test ./mongo/ ./cache/mongo/ ./session/mongo/ ./queue/mongo/ -run Live -v
