# Checks for the website.
#
# This does NOT deploy. The site runs on a Dokploy host that watches this
# repository and builds site/Dockerfile itself, so a deploy step here would be a
# second thing to keep in step with the first — and the one that goes stale is
# always the one nobody is watching.
#
# What this does instead is fail the build before Dokploy ever sees the commit,
# so a broken page is caught here rather than in a container that will not start.
name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - ".github/workflows/site.yml"
      # The site renders the framework's own version and imports its packages,
      # so a framework change can break the page with site/ untouched.
      - "**/*.go"
  pull_request:
    paths:
      - "site/**"
      - "install.sh"
      - "**/*.go"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: site/go.sum

      # The site serves the repository's installer at /install.sh from its own
      # committed copy. Refreshing it here means a change to the real installer
      # shows up as a diff rather than as two scripts quietly drifting apart —
      # and the check below is what fails if nobody committed the refresh.
      - name: The served installer matches the real one
        run: |
          cp install.sh site/resources/install.sh
          if ! git diff --quiet -- site/resources/install.sh; then
            echo "::error::site/resources/install.sh is stale. Run 'cp install.sh site/resources/install.sh' and commit it."
            git diff --stat -- site/resources/install.sh
            exit 1
          fi

      # Generated views are not committed — the scaffold ignores *_templ.go and
      # regenerates them on every build, so there is no stale-output check to
      # make here. templ failing IS the check.
      - name: Generate views
        working-directory: site
        run: go tool templ generate

      - name: Vet
        working-directory: site
        run: go vet ./...

      - name: Format
        working-directory: site
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        working-directory: site
        run: go test ./...

      # buildx defaults to the "docker" driver, which cannot export a build
      # cache at all. The container driver can, and still supports --load, so
      # the image below is still available to run afterwards.
      - uses: docker/setup-buildx-action@v3

      # Build the image the host will build, so a Dockerfile mistake fails here
      # rather than halfway through a deploy.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          # The same context the deploy host uses. The site depends on a
          # published release of the framework rather than the tree above it,
          # so it needs nothing outside this directory.
          context: site
          file: site/Dockerfile
          push: false
          load: true
          tags: ryla-site:ci
          # Reuse the previous run's layers. Most pushes change a template or a
          # stylesheet, so the module download and the dependency compile are
          # already done — which makes this quick and, more usefully, means the
          # step that reaches out to the module proxy usually does not run at
          # all.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The claim the page makes about itself, checked. If this image ever needs
      # a base with a shell in it, that is a decision worth noticing.
      - name: The image is just the binary
        run: |
          docker image inspect ryla-site:ci --format '{{.Size}}' \
            | awk '{ printf "image: %.1f MB\n", $1/1024/1024 }'
          layers=$(docker image inspect ryla-site:ci --format '{{len .RootFS.Layers}}')
          echo "layers: $layers"

      - name: It serves
        run: |
          docker run -d --name ryla-site-ci -p 8080:8080             -e APP_KEY="base64:$(openssl rand -base64 32)" ryla-site:ci
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/up; then
              break
            fi
            sleep 1
          done
          for path in / /about /contact /privacy /index.md /about.md /contact.md /privacy.md \
                      /install.sh /llms.txt /agents.md /robots.txt /sitemap.xml; do
            curl -fsS -o /dev/null -w "GET $path %{http_code}\n" "http://127.0.0.1:8080$path"
          done
          # The one that would be embarrassing to get wrong: what people pipe
          # into a shell has to be a shell script.
          curl -fsS http://127.0.0.1:8080/install.sh | head -1 | grep -q '^#!/bin/sh'
          # The version is read from build info, so a page reporting "dev" means
          # the module resolved to a replace rather than a release.
          curl -fsS http://127.0.0.1:8080/llms.txt | grep '^Current version:'
          curl -fsS http://127.0.0.1:8080/llms.txt | grep -q '^Current version: v'             || { echo "::error::the site reports no released version"; exit 1; }
          docker rm -f ryla-site-ci

      # The three things an agent audit checks that a rendering page cannot
      # tell you about. They are checked here as well as in the feature tests
      # because this is the built image answering over a real socket, which is
      # where a proxy or a header set in the wrong place would show up.
      - name: It answers machines correctly
        run: |
          docker run -d --name ryla-site-agents -p 8081:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" ryla-site:ci
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8081/up; then break; fi
            sleep 1
          done

          # A real 404 for a path that does not exist. A 200 here would tell
          # every crawler that every address on this domain exists.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/some-path-that-does-not-exist)
          echo "GET /some-path-that-does-not-exist $code"
          [ "$code" = "404" ] || { echo "::error::a missing path answered $code, not 404"; exit 1; }

          # ...and a body an agent can act on rather than a bare status.
          curl -s -H 'Accept: text/markdown' http://127.0.0.1:8081/some-path-that-does-not-exist \
            | grep -q 'llms.txt' || { echo "::error::the 404 body points nowhere"; exit 1; }

          # Markdown content negotiation, including the Vary header without
          # which a CDN serves one audience the other's answer.
          curl -sS -D /tmp/md.h -o /dev/null -H 'Accept: text/markdown' http://127.0.0.1:8081/
          grep -qi '^content-type: text/markdown' /tmp/md.h || { echo "::error::Accept: text/markdown did not return markdown"; exit 1; }
          grep -qi '^vary:.*accept' /tmp/md.h            || { echo "::error::the markdown response is missing Vary: Accept"; exit 1; }

          curl -sS -D /tmp/html.h -o /dev/null -H 'Accept: text/html' http://127.0.0.1:8081/
          grep -qi '^content-type: text/html' /tmp/html.h || { echo "::error::a browser stopped getting the page"; exit 1; }
          grep -qi '^vary:.*accept' /tmp/html.h          || { echo "::error::the page response is missing Vary: Accept"; exit 1; }

          # The agent instructions say when to reach for Ryla, not just what it is.
          curl -fsS http://127.0.0.1:8081/llms.txt  | grep -q '## When to use Ryla' || { echo "::error::llms.txt has no when-to-use guidance"; exit 1; }
          curl -fsS http://127.0.0.1:8081/agents.md | grep -q '## How to call it'   || { echo "::error::agents.md has no calling guidance"; exit 1; }

          docker rm -f ryla-site-agents
